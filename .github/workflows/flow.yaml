name: Render STL Previews

on:
  push:
    branches:
        - main
  workflow_dispatch:

permissions:
  contents: write

# One run at a time so concurrent pushes don't race each other
concurrency:
  group: render-previews-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-matrix:
    name: Detect Stale SCAD files
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Pythone with Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Find SCAD files
        id: set-matrix
        run: python3 .github/matrix/generate.py

  render-with-preview:
    if: ${{ needs.generate-matrix.outputs.matrix != '' }}
    name: Generate Previews
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix).include }}
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4
      - name: Render STL
        run: |
          docker run --rm -v "$PWD":/openscad -w /openscad openscad/openscad:dev.2026-10-20 \
            openscad --backend=manifold --export-format binstl -o "${{ matrix.name }}.stl" "${{ matrix.name }}.scad"
      - name: Render PNG
        run: |
          docker run --rm --init -v "$PWD":/openscad -w /openscad openscad/openscad:dev.2026-10-20 \
            openscad --backend=manifold -o "${{ matrix.name }}.png" --imgsize=800,600 --render --viewall "${{ matrix.name }}.scad"
      - name: Check the results image from STL
        run: ls ${{ matrix.name }}.png
      # Collect outputs under out/<folder>/ so the commit job can put them back in place
      - name: Stage outputs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out/${{ matrix.folder }}"
          cp "${{ matrix.name }}.stl" "${{ matrix.name }}.png" "$GITHUB_WORKSPACE/out/${{ matrix.folder }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ strategy.job-index }}
          path: out/
          retention-days: 1

  # Single job commits all renders at once; matrix jobs pushing in parallel used to reject each other
  commit:
    name: Commit Previews
    needs: [generate-matrix, render-with-preview]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: render-*
          merge-multiple: true
          path: ${{ runner.temp }}/out
      - name: Commit and push changes
        env:
          MATRIX: ${{ needs.generate-matrix.outputs.matrix }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            updated=()
            while read -r entry; do
              folder=$(jq -r .folder <<< "$entry")
              name=$(jq -r .name <<< "$entry")
              # Model folder (SCAD or its use<>/include<> deps) changed since this run started: leave it to the next run
              if ! git diff --quiet "$GITHUB_SHA" HEAD -- "$folder"; then
                echo "Skipping $folder/$name.scad, $folder changed since $GITHUB_SHA"
                continue
              fi
              cp "$RUNNER_TEMP/out/$folder/$name.stl" "$RUNNER_TEMP/out/$folder/$name.png" "$folder/"
              # Readme
              if [ ! -f "$folder/README.md" ]; then
                echo "# $name" > "$folder/README.md"
                echo "" >> "$folder/README.md"
                echo "![preview]($name.png)" >> "$folder/README.md"
                echo "Created $folder/README.md"
              fi
              git add "$folder"
              updated+=("$folder/$name.scad")
            done < <(jq -c '.include[]' <<< "$MATRIX")
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "Add STL & preview for ${updated[*]}"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push rejected, retrying on top of latest $BRANCH"
            sleep $((attempt * 5))
          done
          exit 1
